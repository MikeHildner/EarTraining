<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>EarTraining.App</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="EarTraining.App.styles.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script>
        // Play a finished WAV (rendered in C# by EarTraining.Core) via the WebView's
        // HTML5 audio — same approach as the website, so no platform audio code is needed.
        let etAudio = null, etUrl = null;
        window.playWavBase64 = (b64) => {
            // Stop anything still playing so a double-fired tap can't overlap into an echo.
            if (etAudio) { etAudio.pause(); }
            if (etUrl) { URL.revokeObjectURL(etUrl); }
            const bin = atob(b64);
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            etUrl = URL.createObjectURL(new Blob([bytes], { type: "audio/wav" }));
            etAudio = new Audio(etUrl);
            return etAudio.play();
        };
    </script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>

</body>

</html>
